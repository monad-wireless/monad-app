kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

#Kotlin/Native
kotlin.native.disableCompilerDaemon=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Monad — the single version of this application.
#
# There used to be three, and they disagreed: AppConfig.APP_VERSION said 0.3.0-lab, Android said
# 1.0 (code 1), iOS said 1.1.0 (build 4). The sidecar recorded the first of those, so "which build
# produced this recording?" had no answer that any build system agreed with — unacceptable for a
# dataset that has to stay auditable for years.
#
# These two properties are now the only place a version is written by hand. Everything else is
# derived from them:
#   - android.defaultConfig.versionName / versionCode        (derived, cannot drift)
#   - sk.martinvanco.monad.core.config.BuildIdentity         (generated Kotlin, shared by both
#                                                             platforms, reaches the sidecar)
#   - iosApp MARKETING_VERSION / CURRENT_PROJECT_VERSION     (checked, not derived — Xcode reads
#                                                             build settings before Gradle runs, so
#                                                             :composeApp:verifyIosAppVersion fails
#                                                             the iOS build on any disagreement)
#
# 1.2.0 / 5 is the smallest pair that is >= all three predecessors on both stores; going backwards
# on CURRENT_PROJECT_VERSION would be rejected by App Store Connect.
monad.version=1.2.0
monad.versionCode=5
